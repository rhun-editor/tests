name = tests
owner = rhun-editor
title = Tests
description = Go and Rust tests in rhun's Testing view: run, debug, results, diffs and coverage.
icon = icon.png
color = #2a9d5a
version = 0.1.0
protocol = 1
run.linux-x86_64 = bin/tests-linux-x86_64
run.macos-arm64 = bin/tests-macos-arm64
run.windows-x64 = bin/tests-windows-x64.exe

[provides]
# the files it has tests in: it starts when one opens, when Testing is shown or a test command runs
tests = *_test.go *.rs
tests.profiles = run debug coverage

[needs]
documents = read
project = read
# rhun starts go and cargo for it, with your access, during the test runs you start
tests = go cargo
# Debug (a test run with the debug profile) starts its debuggers below
debug = yes

[settings]
go_flags.type = string
go_flags.title = Extra go test flags
go_flags.description = Added to every go test command, for example -race or -count=1.
cargo_flags.type = string
cargo_flags.title = Extra cargo test flags
cargo_flags.description = Added to every cargo test command, for example --features full.

# the debuggers Debug starts for a test (never offered for F5: no languages)
[debugger.go-test]
title = Go tests (Delve)
program = dlv
paths = ~/go/bin
args = dap --listen=127.0.0.1:${port}
transport = tcp
requests = launch
install = go install github.com/go-delve/delve/cmd/dlv@latest
attr.mode = choice debug test exec
attr.program = path
attr.args = list
attr.cwd = path

[debugger.rust-test]
title = Rust tests (lldb-dap)
program = lldb-dap lldb-dap-20 lldb-dap-19 lldb-dap-18
program.macos-arm64 = xcrun
args.macos-arm64 = lldb-dap
requests = launch
attr.program = path
attr.args = list
attr.cwd = path
